name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compute version
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        [ "$GITHUB_REF_TYPE" != "tag" ] && VERSION="dev"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Building version: $VERSION"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build executable
      run: pyinstaller audit-merge.spec --clean

    - name: Verify executable
      run: |
        Get-ChildItem dist/
        if (Test-Path dist\audit-merge.exe) { Write-Host "Executable built successfully" } else { exit 1 }

    - name: Rename with version
      run: |
        Remove-Item dist\audit-merge-windows-${{ env.VERSION }}.exe -ErrorAction SilentlyContinue
        Rename-Item dist\audit-merge.exe audit-merge-windows-${{ env.VERSION }}.exe
        Get-ChildItem dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: audit-merge-windows
        path: dist/audit-merge-windows-${{ env.VERSION }}.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Compute version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        [ "$GITHUB_REF_TYPE" != "tag" ] && VERSION="dev"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Building version: $VERSION"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build PyInstaller binary
      run: pyinstaller audit-merge.spec --clean

    - name: Verify binary
      run: |
        ls -la dist/
        test -x dist/audit-merge || { echo "Binary not found"; exit 1; }

    - name: Prepare AppDir
      run: |
        mkdir -p AppDir/usr/bin
        cp dist/audit-merge AppDir/usr/bin/audit-merge
        cp assets/audit-merge.desktop AppDir/audit-merge.desktop
        cp assets/audit-merge.png AppDir/audit-merge.png
        cat > AppDir/AppRun <<'EOF'
        #!/bin/bash
        SELF="$(readlink -f "$0")"
        HERE="${SELF%/*}"
        export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
        exec "${HERE}/usr/bin/audit-merge" "$@"
        EOF
        chmod +x AppDir/AppRun

    - name: Download appimagetool
      run: |
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
        chmod +x /tmp/appimagetool

    - name: Build AppImage
      env:
        ARCH: x86_64
      run: |
        /tmp/appimagetool --appimage-extract-and-run AppDir "dist/audit-merge-${{ env.VERSION }}-x86_64.AppImage"
        ls -la dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: audit-merge-linux
        path: |
          dist/audit-merge-${{ env.VERSION }}-x86_64.AppImage
          dist/audit-merge
        retention-days: 30

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -laR artifacts/

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}